title: UHHformats
author: University of Hamburg, Institute of Marine Ecosystem and Fishery Science
version: 1.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    html-doc:
      theme: default
      css: styles/styles.css
      include-after-body: styles/js_logo.html
      self-contained: true
      toc: true
      toc-depth: 3
      toc-location: left
    pdf-doc:
      documentclass: scrartcl
      pdf-engine: xelatex
      mainfont: "Helvetica Neue"
      include-in-header: styles/in-header-simple.tex
      toc: false
      number-sections: true
    pdf-report:
      documentclass: scrbook
      pdf-engine: xelatex
      mainfont: "Helvetica Neue"
      include-in-header: styles/in-header-report.tex
      include-before-body: styles/before-body-report.tex
      toc: true
      toc-depth: 3
      number-sections: true
    pdf-cheatsheet:
      template: styles/cheatsheet-template.tex
      pdf-engine: xelatex
      mainfont: "Helvetica Neue"
      highlight-style: kate
      toc-depth: 1
